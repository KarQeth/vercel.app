<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="8" fill="#111114"/>
  <!-- Glitch slice top -->
  <clipPath id="top">
    <rect x="0" y="6" width="32" height="8"/>
  </clipPath>
  <!-- Glitch slice bottom -->
  <clipPath id="bot">
    <rect x="0" y="18" width="32" height="8"/>
  </clipPath>
  <!-- Main K letter -->
  <text
    x="16" y="23"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="22"
    text-anchor="middle"
    fill="#FAFAFA"
    letter-spacing="-1"
  >K</text>
  <!-- Glitch layer top — cyan -->
  <text
    x="14.5" y="23"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="22"
    text-anchor="middle"
    fill="#38bdf8"
    opacity="0.55"
    letter-spacing="-1"
    clip-path="url(#top)"
  >K</text>
  <!-- Glitch layer bottom — purple -->
  <text
    x="17.5" y="23"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="22"
    text-anchor="middle"
    fill="#9d68f5"
    opacity="0.55"
    letter-spacing="-1"
    clip-path="url(#bot)"
  >K</text>
  <!-- Accent dot — electric purple -->
  <circle cx="24" cy="8" r="2.5" fill="#7C3AED"/>
</svg>